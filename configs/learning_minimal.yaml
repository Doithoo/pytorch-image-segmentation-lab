data:
  data_dir: data/raw
  manifest_dir: data/manifests
  image_size: 128
  label_map: {1: 1, 2: 0}
  ignore_values: [3]
  split_ratios: [0.8, 0.1, 0.1]
  num_workers: 0
  pin_memory: false
  horizontal_flip: 0.5
  max_train_samples: 256
  max_valid_samples: 64
  max_test_samples: 64
model:
  name: unet_small
  in_channels: 3
  num_classes: 2
  base_channels: 16
  pretrained: false
loss:
  name: cross_entropy
  cross_entropy_weight: 1.0
  dice_weight: 0.0
  ignore_index: 255
train:
  epochs: 2
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: none
  grad_clip: 0.0
  seed: 42
device: auto
output_dir: artifacts
run_name: null
log_level: info
