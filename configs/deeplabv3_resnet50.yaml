config_version: 2
data:
  name: oxford_pet
  params: {}
  data_dir: data/raw
  manifest_dir: data/manifests
  image_size: 256
  label_map: {1: 1, 2: 0}
  ignore_values: [3]
  split_ratios: [0.8, 0.1, 0.1]
  seed: 666
  num_workers: 4
  pin_memory: true
  horizontal_flip: 0.5
  max_train_samples: null
  max_valid_samples: null
  max_test_samples: null
model:
  name: deeplabv3_resnet50
  in_channels: 3
  expected_num_classes: 2
  pretrained: true
  params: {}
loss:
  name: cross_entropy_dice
  cross_entropy_weight: 0.5
  dice_weight: 0.5
  ignore_index: 255
train:
  epochs: 15
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  grad_clip: 0.0
  seed: 42
  amp: false
  best_metric: class_iou:pet
device: auto
output_dir: artifacts
run_name: deeplabv3-resnet50
log_level: info
