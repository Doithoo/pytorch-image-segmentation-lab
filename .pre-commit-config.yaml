repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: tests
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
