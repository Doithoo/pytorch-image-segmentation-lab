name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test without network-dependent assets
        run: uv run pytest -W error::DeprecationWarning

  model-zoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked optional model environment
        run: uv sync --locked --extra dev --extra model-zoo
      - name: Test optional models without pretrained weights
        run: uv run --extra model-zoo pytest -m model_zoo tests/test_smp_models.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Build distributions
        run: uv run python -m build
      - name: Validate package metadata
        run: uv run twine check dist/*
      - name: Smoke test wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/image-segmenter-wheel-smoke
          uv pip install --python /tmp/image-segmenter-wheel-smoke/bin/python dist/*.whl
          /tmp/image-segmenter-wheel-smoke/bin/segment --version
          /tmp/image-segmenter-wheel-smoke/bin/segment show-config
